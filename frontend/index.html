<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Distributed VM Manager</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="backdrop"></div>

        <main class="page">
            <header class="hero">
            <div>
                <p class="eyebrow">Virtual Infrastructure</p>
                <h1>Distributed VM Manager</h1>
                <p class="subtitle">
                    Monitor and manage simulated virtual machines
                    across multiple servers
                </p>
            </div>

            <div class="meta">
                <div class="meta-card">
                    <span class="meta-label">Last Refresh</span>
                    <span id="last updated">--</span>
                </div>

            <button id="refresh" class="ghost" type="button">
                Refresh Now
            </button>
            </div>
        </header>

        <section class="grid">
            <div class="panel">
                <div class="panel-header">
                <h2>Servers</h2>
                <p>Simulated servers in the virtual infrastructure.</p>
            </div>

            <div id="server-list"></div>
            </div>
        </section>

        </main>

        <script src="app.js"></script>
    </body>
</html>
